# One Nebius AI Cloud VM: Caddy (HTTPS, required for the mic and notifications) + the app.
# Set DOMAIN in .env (e.g. rainb.example.com, or <ip>.sslip.io) along with NEBIUS_API_KEY.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/home/user/app/data
    expose:
      - "7860"

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  caddy_data:
